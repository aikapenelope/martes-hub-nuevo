packages:
  - '.'

# pnpm >=10.34 ya no lee `pnpm.onlyBuiltDependencies`/`pnpm.overrides` desde
# package.json — con pnpm 11 el silencio es total (sin warning, el override
# simplemente no se aplica y el lockfile revierte la versión vulnerable sin
# aviso). Ver github.com/pnpm/pnpm/issues/11536. Esta es la ubicación
# canónica desde pnpm 10.x en adelante.
onlyBuiltDependencies:
  - sharp
  - esbuild
  - unrs-resolver

overrides:
  dompurify: ^3.4.14
  esbuild: ^0.28.2
  undici: ^8.10.0
